[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.1",
    "build>=1.4.0",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["."]